name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: e2r-liaison-scape

      - name: Checkout canonical E2R specification fixtures
        uses: actions/checkout@v6
        with:
          repository: sukoyaka-dopeness/e2r-spec
          ref: 53eedc7a8150943a1f8362849b684960c142ab12
          path: e2r-spec

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: e2r-liaison-scape/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: e2r-liaison-scape
        run: npm ci

      - name: Run tests
        working-directory: e2r-liaison-scape
        run: npm run test

      - name: Run lint
        working-directory: e2r-liaison-scape
        run: npm run lint

      - name: Build
        working-directory: e2r-liaison-scape
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./e2r-liaison-scape/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
